{% extends 'base.html' %}

{% block content %}
<div
    style="max-width: 400px; margin: 4rem auto; padding: 2rem; border: 1px solid #ddd; border-radius: 8px; background: white; border-top: 5px solid #2c3e50;">
    <h2 style="text-align: center; margin-bottom: 2rem; color: #2c3e50;">Admin Login</h2>
    {% if messages %}
    {% for message in messages %}
    <div style="color: red; text-align: center; margin-bottom: 1rem;">{{ message }}</div>
    {% endfor %}
    {% endif %}
    <form method="POST">
        {% csrf_token %}
        <div class="form-group">
            {{ form.as_p }}
        </div>
        <button type="submit" class="btn" style="width: 100%; background-color: #2c3e50;">Login as Admin</button>
    </form>
</div>
{% endblock %}
